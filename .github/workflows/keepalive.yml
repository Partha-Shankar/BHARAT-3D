name: Keep API warm

# Render's free web services sleep after 15 minutes without traffic, and the first visit then waits ~1 minute.
# Ping the API during Indian daytime only (about 07:30-23:30 IST): the free plan's instance hours are shared by
# every free service in the workspace, so the API is not kept awake around the clock.
on:
  schedule:
    - cron: "*/10 2-17 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 120 https://bharat-3d-backend.onrender.com/health || true
