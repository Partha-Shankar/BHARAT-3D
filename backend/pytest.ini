[pytest]
testpaths = tests
# Run as `python -m pytest -q` (README). -q is not repeated here: twice (-qq) hides the pass/fail summary line.
addopts = --strict-markers
markers =
    unit: pure functions, no app and no disk outside a temp directory
    api: FastAPI endpoints through TestClient with dependency overrides
    ingest: pseudo-code survey-file readers
    slow: subprocess or large-input tests
