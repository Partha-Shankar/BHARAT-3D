# Cloudflare Pages project for the BHARAT 3D web app (direct upload: npm run build:pages, then wrangler pages deploy).
name = "bharat-3d"
compatibility_date = "2026-09-09"
pages_build_output_dir = "dist"

# Backend the same-origin /api proxy forwards to (Render today; a Hugging Face Space can replace it here).
[vars]
BACKEND_ORIGIN = "https://bharat-3d-backend.onrender.com"

# Generated areas, saved by the backend after every change so they survive backend restarts.
[[r2_buckets]]
binding = "AREAS"
bucket_name = "bharat3d-areas"

# Analytics: every request, sign-in, page view and action with location and device.
[[d1_databases]]
binding = "ANALYTICS"
database_name = "bharat3d-analytics"
database_id = "c4156113-b514-49f3-8ff8-064be7bcc5e6"

# Secrets (set with `wrangler pages secret put`, never committed): STORE_TOKEN, ANALYTICS_KEY, JWT_SECRET.
