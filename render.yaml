# Render Blueprint — BHARAT 3D API (FastAPI). Matches the live web service `bharat-3d-api` (https://bharat-3d-api.onrender.com).
# New → Blueprint → select this repository. Values marked `sync: false` are entered in the dashboard.
services:
  - type: web
    name: bharat-3d-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      # Durable area store: the web app's Pages Function, backed by Cloudflare R2. Every generated area and the national
      # INF ledger are restored from it at startup and saved to it after every change, so restarts and moves lose nothing.
      - key: STORE_URL
        value: https://bharat-3d.pages.dev/api/__store
      # Must equal the Pages secret STORE_TOKEN (the store refuses any other token).
      - key: STORE_TOKEN
        sync: false
      # Must equal the Pages secret JWT_SECRET, so sign-ins stay valid across backend moves and the edge can serve
      # scenes from R2. Never generate a new value here.
      - key: SECRET_KEY
        sync: false
      # Optional: Groq LLM for building names and area summaries (without it, names come from Faker).
      - key: GROQ_API_KEY
        sync: false
